name: update-news

on:
  schedule:
    - cron: "30 0 * * *"   # UTC 00:30 = JST 09:30
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 記事取得・要約・暗号化
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
        run: python -u scripts/build.py

      - name: 状態をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update news $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      # 要約全滅・全フィード空のとき、コミットとデプロイを終えてからジョブを失敗させ、通知で気づけるようにする
      - name: 異常を通知(ジョブを失敗させる)
        if: steps.build.outputs.alert == 'true'
        run: |
          echo "::error::要約が全件失敗、または全フィードが空でした。ジョブサマリーとログを確認してください。"
          exit 1
